# ============================================================
# 智学问答 一键部署：mysql + backend + frontend
#
# 用法：
#   1. cp .env.example .env 并填入 AI_API_KEY（阿里百炼）
#   2. docker compose up -d --build
#   3. 浏览器打开 http://localhost:8080（Nginx 已反代 /api 与 /uploads）
#
# 数据持久化：MySQL 数据、上传文档、向量库文件均为命名卷，
# compose down 不丢数据（down -v 才会删卷）。
# ============================================================
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-zhixue_dev_2026}
      MYSQL_DATABASE: rag_learning
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表（已有数据的卷不会重复执行）
      - ./backend/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-zhixue_dev_2026}
      # 大模型（默认阿里百炼 OpenAI 兼容模式）
      AI_API_KEY: ${AI_API_KEY:?请在 .env 中设置 AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen-plus}
      # 嵌入模型需显式指定（application.yml 默认值仅覆盖 chat）
      SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v4}
      JWT_SECRET: ${JWT_SECRET:-zhixue-qa-compose-jwt-secret-change-me-32chars}
    volumes:
      - uploads-data:/app/uploads
      - vector-data:/app/data
    # 后端不直接暴露端口，统一经 frontend 的 Nginx 入口；
    # 本机直调接口调试时取消注释：
    # ports:
    #   - "8081:8081"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
  uploads-data:
  vector-data:
