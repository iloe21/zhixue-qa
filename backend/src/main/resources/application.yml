server:
  port: 8081

spring:
  application:
    name: rag-learning-backend

  # 加载本地私密配置（API Key 等，该文件已在 .gitignore 中，不提交 Git）
  profiles:
    active: local

  # ===== MySQL 数据库 =====
  # 真实密码写在 application-local.yml（已 gitignore）或环境变量 DB_PASSWORD，勿改本文件提交
  datasource:
    url: jdbc:mysql://localhost:3306/rag_learning?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 上传文件大小限制（设计文档 1.3 非功能需求）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ===== 邮件发送（QQ 邮箱 SMTP，忘记密码功能）=====
  # 真实账号/授权码配置在 application-local.yml（不提交 Git）
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:change_me@qq.com}
    password: ${MAIL_PASSWORD:change_me}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # ===== Spring AI（大模型接入）=====
  # 当前为占位配置，工程骨架阶段不调用大模型。
  # 任务 #5 开发问答功能前：
  #   1. 注册 DeepSeek（https://platform.deepseek.com）拿 API Key
  #   2. 设置环境变量 AI_API_KEY（不要直接改本文件提交 Git）
  #   3. Embedding 模型 DeepSeek 不提供，届时用 spring.ai.openai.embedding.api-key /
  #      base-url 单独指向智谱或百炼（DashScope 兼容模式）
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_CHAT_MODEL:deepseek-chat}
          temperature: 0.3

# ===== MyBatis-Plus =====
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.graduation.rag.entity
  configuration:
    map-underscore-to-camel-case: true

# ===== JWT =====
# 生产环境通过环境变量 JWT_SECRET 覆盖（密钥至少 32 字符）
jwt:
  secret: ${JWT_SECRET:rag-learning-jwt-secret-key-2026-zhixue-qa-dev}
  expiration: 86400000   # 24 小时（毫秒）

# ===== 应用自定义配置 =====
# 相对路径基于后端启动时的工作目录（backend/）
app:
  upload-dir: ./uploads                      # 上传文档存储目录
  vector-store-path: ./data/vectorstore.json # 向量库持久化文件
  parse:
    chunk-chars: 800           # 切分块大小（字符，中文约 500 token，对应设计文档 5.1）
    overlap-chars: 120         # 块间重叠（字符），防止上下文断裂
    embedding-batch-size: 6    # 百炼 Embedding 单批条数上限（接口限制 ≤10，留余量）
  rag:
    top-k: 5                   # 检索返回片段数（设计文档 5.2，实验阶段可调优）
    # 相似度阈值：基于 text-embedding-v4 实测校准（2026-10-13）
    # 相关内容得分区间 0.31~0.43，无关内容 0.18~0.26，取 0.28 可完美分界
    # 注意：该值与嵌入模型绑定，更换 Embedding 模型必须重新校准
    similarity-threshold: 0.28

logging:
  level:
    com.graduation.rag: info
